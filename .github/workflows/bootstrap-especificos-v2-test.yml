name: Bootstrap Especificos v2 in TEST

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/bootstrap-especificos-v2-test.yml

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Copy PRD Especificos to TEST, split main v2 and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request

          PRD='https://la-sala-app-default-rtdb.europe-west1.firebasedatabase.app'
          TEST='https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app'
          MAIN='lasala-especificos-v1'
          PART='lasala-especificos-partida-v1'
          INDEX='lasala-especificos-v2-index'

          def raw_get(base,key):
              with urllib.request.urlopen(f'{base}/{key}.json',timeout=180) as r:
                  return r.read()

          def parse_storage(raw,label):
              outer=json.loads(raw.decode('utf-8'))
              if outer is None: return None
              if not isinstance(outer,str):
                  raise SystemExit(f'{label}: contrato inesperado {type(outer).__name__}, se esperaba string JSON')
              return json.loads(outer)

          def put_raw(base,key,raw):
              req=urllib.request.Request(
                  f'{base}/{key}.json',
                  data=raw,
                  headers={'Content-Type':'application/json'},
                  method='PUT'
              )
              with urllib.request.urlopen(req,timeout=180) as r:
                  assert 200 <= r.status < 300
                  r.read()

          def storage_body(obj):
              inner=json.dumps(obj,ensure_ascii=False,separators=(',',':'))
              return json.dumps(inner,ensure_ascii=False,separators=(',',':')).encode('utf-8')

          def canon(obj):
              return json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')

          def sha(obj):
              return hashlib.sha256(canon(obj)).hexdigest()

          # 1) Copia segura PRD -> TEST de las dos fuentes legacy.
          copied={}
          for key in (MAIN,PART):
              prd_raw=raw_get(PRD,key)
              prd=parse_storage(prd_raw,'PRD '+key)
              assert isinstance(prd,dict), f'PRD {key} no es objeto'
              test_raw=raw_get(TEST,key)
              test=parse_storage(test_raw,'TEST '+key) if test_raw!=b'null' else None

              print(f'PRD {key}: raw_bytes={len(prd_raw)} top_count={len(prd)} sha={sha(prd)}')
              if test is None:
                  put_raw(TEST,key,prd_raw)
                  print(f'COPIED {key} PRD->TEST')
              else:
                  if sha(test)!=sha(prd):
                      raise SystemExit(f'ABORT: TEST {key} ya contiene datos distintos; no se sobrescribe')
                  print(f'TEST {key} ya era idéntico; no se reescribe')

              after=parse_storage(raw_get(TEST,key),'TEST after '+key)
              assert sha(after)==sha(prd)
              copied[key]=prd
              print(f'VERIFIED {key}: top_count={len(after)} sha={sha(after)}')

          main=copied[MAIN]
          part=copied[PART]

          # 2) Segmentar SOLO lasala-especificos-v1 por INV.
          #    v1 permanece intacto; no se toca código de aplicación en este bloque.
          index_raw=raw_get(TEST,INDEX)
          if index_raw!=b'null':
              existing=parse_storage(index_raw,'TEST '+INDEX)
              raise SystemExit(f'ABORT: {INDEX} ya existe con {len(existing) if isinstance(existing,list) else "?"} entradas')

          ids=list(main.keys())
          for inv in ids:
              key=f'lasala-especificos-v2-{inv}'
              existing=raw_get(TEST,key)
              if existing!=b'null':
                  raise SystemExit(f'ABORT: {key} ya existe; no se sobrescribe')
              put_raw(TEST,key,storage_body(main[inv]))
              print(f'WROTE {key}')

          put_raw(TEST,INDEX,storage_body(ids))

          # 3) Reconstrucción exacta desde shards v2.
          rebuilt={}
          total_raw=0
          shard_rows=[]
          for inv in ids:
              key=f'lasala-especificos-v2-{inv}'
              raw=raw_get(TEST,key)
              obj=parse_storage(raw,key)
              assert isinstance(obj,dict)
              rebuilt[str(inv)]=obj
              cells=sum(len(day) for day in obj.values() if isinstance(day,dict))
              total_raw += len(raw)
              shard_rows.append((len(raw),str(inv),len(obj),cells))
              print(f'SHARD inv={inv} raw_bytes={len(raw)} days={len(obj)} cells={cells}')

          idx=parse_storage(raw_get(TEST,INDEX),INDEX)
          assert idx==ids
          assert len(rebuilt)==len(main)
          assert sha(rebuilt)==sha(main)
          print('ESPECIFICOS_V2_REBUILT_SHA=',sha(rebuilt))
          print('ESPECIFICOS_V1_SHA=',sha(main))
          print('INDEX_COUNT=',len(idx))
          print('V2_TOTAL_RAW_BYTES=',total_raw)
          print('MAX_SHARD=',max(shard_rows) if shard_rows else None)
          print('AVG_SHARD_RAW_BYTES=',round(total_raw/len(shard_rows),2) if shard_rows else 0)

          # 4) Radiografía del nodo por partida para decidir su arquitectura.
          #    No se segmenta aún: primero se contrasta su forma real.
          rec_count=0
          inv_counts={}
          array_entries=0
          non_arrays=0
          for partida_id,regs in part.items():
              if isinstance(regs,list):
                  array_entries += 1
                  rec_count += len(regs)
                  for r in regs:
                      if isinstance(r,dict):
                          inv=str(r.get('invId') or '')
                          if inv:
                              inv_counts[inv]=inv_counts.get(inv,0)+1
              else:
                  non_arrays += 1
          print('PARTIDA_TOP_KEYS=',len(part))
          print('PARTIDA_ARRAY_KEYS=',array_entries)
          print('PARTIDA_NON_ARRAY_KEYS=',non_arrays)
          print('PARTIDA_TOTAL_RECORDS=',rec_count)
          print('PARTIDA_INV_COUNTS=',json.dumps(dict(sorted(inv_counts.items())),ensure_ascii=False,separators=(',',':')))

          print('ESPECIFICOS_BOOTSTRAP_VERIFIED_OK')
          PY
