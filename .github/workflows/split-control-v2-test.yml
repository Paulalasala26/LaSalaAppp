name: Split Control v2 in TEST
on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/split-control-v2-test.yml

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Split and verify TEST Control only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, hashlib, math
          BASE='https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app'
          SOURCE='lasala-control-items-v1'
          INDEX='lasala-control-items-v2-index'

          def req(path, method='GET', data=None):
              url=f'{BASE}/{path}.json'
              body=None if data is None else json.dumps(data,ensure_ascii=False,separators=(',',':')).encode()
              r=urllib.request.Request(url,data=body,method=method,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(r,timeout=120) as resp:
                  raw=resp.read()
              return json.loads(raw.decode()) if raw else None

          def canon(v):
              return json.dumps(v,ensure_ascii=False,separators=(',',':'),sort_keys=True).encode()

          src=req(SOURCE)
          assert isinstance(src,dict) and src, 'Fuente Control vacía/no legible'

          shards={}
          for k,item in src.items():
              assert isinstance(item,dict), f'Item no objeto: {k}'
              tipo=str(item.get('tipo') or '')
              dia=item.get('dia')
              assert tipo in ('tunel','carga'), f'Tipo inesperado {tipo!r} en {k}'
              assert isinstance(dia,(int,float)), f'Día inválido en {k}'
              q=max(0,(int(dia)-15)//14)
              sk=f'lasala-control-items-v2-{tipo}-q{q}'
              shards.setdefault(sk,{})[k]=item

          index={'version':2,'source':SOURCE,'shards':{}}
          for sk,obj in sorted(shards.items()):
              parts=sk.split('-')
              tipo=parts[-2]
              q=int(parts[-1][1:])
              req(sk,'PUT',obj)
              index['shards'][f'{tipo}|{q}']={
                  'key':sk,'tipo':tipo,'q':q,'count':len(obj),'bytes':len(canon(obj))
              }
              print(f'WROTE|{sk}|COUNT={len(obj)}|BYTES={len(canon(obj))}')

          req(INDEX,'PUT',index)

          rebuilt={}
          for meta in index['shards'].values():
              got=req(meta['key'])
              assert isinstance(got,dict), f"Shard no legible {meta['key']}"
              assert len(got)==meta['count'], f"Count distinto {meta['key']}"
              overlap=set(rebuilt).intersection(got)
              assert not overlap, f'IDs duplicados entre shards: {list(overlap)[:3]}'
              rebuilt.update(got)

          h1=hashlib.sha256(canon(src)).hexdigest()
          h2=hashlib.sha256(canon(rebuilt)).hexdigest()
          print('SOURCE_COUNT=',len(src))
          print('REBUILT_COUNT=',len(rebuilt))
          print('SOURCE_SHA256=',h1)
          print('REBUILT_SHA256=',h2)
          print('SHARD_COUNT=',len(shards))
          print('INDEX_BYTES=',len(canon(index)))
          assert len(rebuilt)==len(src)
          assert h1==h2, 'Reconstrucción v2 no idéntica a v1'
          print('CONTROL_V2_SPLIT_VERIFIED_OK')
          PY
