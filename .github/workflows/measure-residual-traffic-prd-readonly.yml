name: Measure residual traffic in PRD read-only

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/measure-residual-traffic-prd-readonly.yml

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Measure PRD residual nodes read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          BASE='https://la-sala-app-default-rtdb.europe-west1.firebasedatabase.app'

          def fetch_node(key, timeout=180):
              url=f'{BASE}/{key}.json'
              req=urllib.request.Request(url, method='GET')
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  raw=r.read()
                  status=getattr(r, 'status', 200)
              try:
                  val=json.loads(raw.decode())
              except Exception:
                  val=None
              return status, raw, val

          def decoded(v):
              if isinstance(v,str):
                  try: return json.loads(v)
                  except Exception: return v
              return v

          def count_top(v):
              v=decoded(v)
              if isinstance(v,(dict,list)): return len(v)
              if v is None: return 0
              return None

          # Nodos monolíticos que interesa cuantificar exactamente.
          for key in [
              'lasala-fito-v1',
              'lasala-especificos-v1',
              'lasala-especificos-partida-v1',
              'lasala-control-pdfs-v1',
          ]:
              status,raw,val=fetch_node(key)
              d=decoded(val)
              print(f'NODE {key}: status={status} raw_bytes={len(raw)} top_count={count_top(val)} type={type(d).__name__}')

              if key in ('lasala-fito-v1','lasala-especificos-v1') and isinstance(d,dict):
                  total_cells=0
                  for inv,v in sorted(d.items(), key=lambda kv:str(kv[0])):
                      days=v if isinstance(v,dict) else {}
                      cells=sum(len(day) for day in days.values() if isinstance(day,dict))
                      total_cells += cells
                      print(f'  INV {inv}: days={len(days)} cells={cells}')
                  print(f'  TOTAL_CELLS={total_cells}')

          # Índices: medirlos completos es barato y suficiente para conocer
          # cardinalidad. NO se descargan los shards de fotos: el propio código
          # histórico indica cientos de MB y medirlos todos generaría tráfico
          # innecesario en PRD.
          for key in [
              'lasala-control-fotos-shards-index',
              'lasala-control-fotos-indice-v1',
              'lasala-control-pdfs-indice-v1',
          ]:
              status,raw,val=fetch_node(key)
              d=decoded(val)
              print(f'INDEX {key}: status={status} raw_bytes={len(raw)} count={count_top(val)} type={type(d).__name__}')
              if key=='lasala-control-fotos-shards-index' and isinstance(d,list):
                  print('  SHARD_KEYS_FIRST=', d[:3])
                  print('  SHARD_KEYS_LAST=', d[-3:] if len(d)>3 else d)
          PY
