name: Cleanup restore check in Firebase TEST
on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/verify-restore-check.yml
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary restore node
        run: |
          set -euo pipefail
          TEST="https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app"
          code="$(curl -sS -o /tmp/resp -w "%{http_code}" -X DELETE "$TEST/__restore_check_20260922.json")"
          test "$code" = "200"
          check="$(curl -fsS "$TEST/__restore_check_20260922.json")"
          test "$check" = "null"
          echo "TEMP_NODE_DELETED_OK"
