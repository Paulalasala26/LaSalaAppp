name: Split Fito v2 in TEST

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/split-fito-v2-test.yml

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Split Fito by greenhouse and verify exact reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, urllib.request

          BASE='https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app'
          SOURCE='lasala-fito-v1'
          INDEX='lasala-fito-v2-index'

          def raw_get(key):
              with urllib.request.urlopen(f'{BASE}/{key}.json', timeout=180) as r:
                  return r.read()

          def decoded_storage_value(raw):
              outer=json.loads(raw.decode('utf-8'))
              if outer is None:
                  return None
              assert isinstance(outer,str), f'{key}: contrato inesperado, se esperaba string JSON'
              return json.loads(outer)

          def put_storage_value(key, value):
              # Mismo contrato de window.storage.set: Firebase guarda un string
              # cuyo contenido es el JSON real.
              inner=json.dumps(value,ensure_ascii=False,separators=(',',':'))
              body=json.dumps(inner,ensure_ascii=False,separators=(',',':')).encode('utf-8')
              req=urllib.request.Request(
                  f'{BASE}/{key}.json',
                  data=body,
                  headers={'Content-Type':'application/json'},
                  method='PUT'
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  assert 200 <= r.status < 300
                  r.read()

          def parse_storage_raw(raw, label):
              outer=json.loads(raw.decode('utf-8'))
              assert isinstance(outer,str), f'{label}: no es string JSON'
              return json.loads(outer)

          def canon(v):
              return json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')

          src_raw=raw_get(SOURCE)
          src=parse_storage_raw(src_raw,SOURCE)
          assert isinstance(src,dict) and src, 'Fuente Fito v1 vacía/no legible'

          ids=list(src.keys())
          assert len(ids)==22, f'Se esperaban 22 invernaderos, hay {len(ids)}'

          # Salvaguarda: este bloque debe ser la creación inicial de v2.
          idx_raw=raw_get(INDEX)
          idx_outer=json.loads(idx_raw.decode('utf-8'))
          if idx_outer is not None:
              raise SystemExit('ABORT: lasala-fito-v2-index ya existe; no se sobrescribe una v2 previa')

          source_hash=hashlib.sha256(canon(src)).hexdigest()
          source_cells=sum(
              len(day)
              for days in src.values() if isinstance(days,dict)
              for day in days.values() if isinstance(day,dict)
          )
          print('SOURCE_INV_COUNT=',len(src))
          print('SOURCE_CELL_COUNT=',source_cells)
          print('SOURCE_SHA256=',source_hash)

          # Escritura SOLO en TEST v2; v1 permanece intacto.
          for inv in ids:
              key=f'lasala-fito-v2-{inv}'
              existing=json.loads(raw_get(key).decode('utf-8'))
              if existing is not None:
                  raise SystemExit(f'ABORT: {key} ya existe; no se sobrescribe')
              put_storage_value(key, src[inv])
              print(f'WROTE {key}')

          put_storage_value(INDEX, ids)

          # Reconstrucción completa desde v2.
          rebuilt={}
          for inv in ids:
              key=f'lasala-fito-v2-{inv}'
              data=parse_storage_raw(raw_get(key),key)
              assert isinstance(data,dict), f'{key}: contenido no objeto'
              rebuilt[inv]=data

          idx=parse_storage_raw(raw_get(INDEX),INDEX)
          assert isinstance(idx,list), 'Índice v2 no es lista'
          assert idx==ids, 'Índice v2 distinto del orden/conjunto de v1'

          rebuilt_hash=hashlib.sha256(canon(rebuilt)).hexdigest()
          rebuilt_cells=sum(
              len(day)
              for days in rebuilt.values() if isinstance(days,dict)
              for day in days.values() if isinstance(day,dict)
          )

          # Verificar también que v1 no cambió durante el proceso.
          src_after=parse_storage_raw(raw_get(SOURCE),SOURCE)
          source_after_hash=hashlib.sha256(canon(src_after)).hexdigest()

          print('REBUILT_INV_COUNT=',len(rebuilt))
          print('REBUILT_CELL_COUNT=',rebuilt_cells)
          print('REBUILT_SHA256=',rebuilt_hash)
          print('SOURCE_AFTER_SHA256=',source_after_hash)
          print('INDEX_COUNT=',len(idx))

          assert len(rebuilt)==len(src)
          assert rebuilt_cells==source_cells
          assert rebuilt_hash==source_hash, 'Reconstrucción v2 no idéntica a v1'
          assert source_after_hash==source_hash, 'v1 cambió durante la segmentación'
          print('FITO_V2_SPLIT_VERIFIED_OK')
          PY
