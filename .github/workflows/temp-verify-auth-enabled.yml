name: TEMP Verify Firebase Auth enabled

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/temp-verify-auth-enabled.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Identity Toolkit TEST
        shell: bash
        run: |
          set -euo pipefail
          RESP="$(curl -sS -w '\nHTTP_STATUS=%{http_code}\n'             -H 'Content-Type: application/json'             -d '{"token":"not-a-real-custom-token","returnSecureToken":true}'             'https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=AIzaSyDdDdMg6M1jVIssvGYKsdRA-mRug31Yt_g')"
          echo "$RESP" | sed -n '/HTTP_STATUS=/p'
          BODY="$(echo "$RESP" | sed '/HTTP_STATUS=/d')"
          python - "$BODY" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          msg=j.get("error",{}).get("message","")
          print("IDENTITY_TOOLKIT_RESULT", msg)
          if msg == "CONFIGURATION_NOT_FOUND":
              raise SystemExit("Firebase Authentication sigue sin inicializar")
          if not msg:
              raise SystemExit("Respuesta inesperada")
          print("FIREBASE_AUTH_ENABLED OK")
          PY
