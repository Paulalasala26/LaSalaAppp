name: TEMP Activate Firebase Rules TEST

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/temp-activate-firebase-rules.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Activar y verificar Auth + Rules TEST
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://la-sala-app-test.vercel.app'
          DB='https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app'

          PRE="$(curl -fsS --retry 3 --retry-delay 2 "$BASE/api/firebase-security-test")"
          python - "$PRE" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j.get("exchangeOk") is True, j
          assert j.get("authenticatedReadOk") is True, j
          assert j.get("cleanupOk") is True, j
          print("PRE_AUTH_SELFTEST OK")
          PY

          CODE="$(curl -sS -o /tmp/fake-before.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"user":"__INVALID__","password":"__INVALID__"}'             "$BASE/api/firebase-auth")"
          [ "$CODE" = "401" ]
          echo "BACKEND_INVALID_BEFORE_RULES OK 401"

          APPLY="$(curl -fsS -X POST "$BASE/api/firebase-security-test")"
          python - "$APPLY" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j.get("rulesApplied") is True, j
          print("RULES_APPLY OK")
          PY

          sleep 3

          ANON_CODE="$(curl -sS -o /tmp/anon.json -w '%{http_code}' "$DB/lasala-roles-v1.json")"
          case "$ANON_CODE" in
            401|403) echo "ANONYMOUS_READ_BLOCKED OK $ANON_CODE" ;;
            *) echo "Anonymous read unexpectedly returned $ANON_CODE"; cat /tmp/anon.json; exit 1 ;;
          esac

          POST="$(curl -fsS "$BASE/api/firebase-security-test")"
          python - "$POST" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          assert j.get("exchangeOk") is True, j
          assert j.get("authenticatedReadOk") is True, j
          assert j.get("cleanupOk") is True, j
          print("AUTHENTICATED_READ_AFTER_RULES OK")
          PY

          HEALTH="$(curl -fsS "$BASE/api/firebase-auth")"
          python - "$HEALTH" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1])
          for k in ("configured","projectOk","rtdbOk"):
              assert j.get(k) is True, (k,j)
          print("ADMIN_BACKEND_AFTER_RULES OK")
          PY

          CODE2="$(curl -sS -o /tmp/fake-after.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"user":"__INVALID__","password":"__INVALID__"}'             "$BASE/api/firebase-auth")"
          [ "$CODE2" = "401" ]
          echo "BACKEND_INVALID_AFTER_RULES OK 401"

          echo "AUTH_RULES_RESULT OK"
