name: Create restore check node in Firebase TEST
on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/create-restore-check.yml
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create temporary restore node in TEST only
        run: |
          set -euo pipefail
          TEST="https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app"
          code="$(curl -sS -o /tmp/resp -w "%{http_code}" -X PUT             -H "Content-Type: application/json"             --data '{"ready":true}'             "$TEST/__restore_check_20260922.json")"
          test "$code" = "200" || { cat /tmp/resp; exit 1; }
          echo "OK"

# trigger
