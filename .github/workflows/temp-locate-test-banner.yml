name: TEMP Move TEST banner

permissions:
  contents: write

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/temp-locate-test-banner.yml

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v1.0
      - name: Move banner and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/v1.0
          REMOTE="$(git rev-parse origin/test/v1.0)"
          [ "$REMOTE" = "$GITHUB_SHA" ] || { echo "HEAD changed: $REMOTE != $GITHUB_SHA"; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='position:fixed;top:8px;right:8px;z-index:2147483647'
          new='position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647'
          if s.count(old)!=1:
              raise SystemExit(f'Expected exactly 1 banner style, found {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

          grep -Fq 'id="lasala-test-banner" style="position:fixed;top:8px;left:50%;transform:translateX(-50%)' index.html

          git config user.name "Viveros La Sala"
          git config user.email "dev@viveroslasala.com"
          git rm .github/workflows/temp-locate-test-banner.yml
          git add index.html
          git commit -m "fix(test): centrar cartel de entorno TEST"
          git push origin HEAD:test/v1.0
