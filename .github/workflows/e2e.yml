name: E2E smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-quincena:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Ejecutar smoke de recorridos críticos
        run: pnpm exec playwright test tests/e2e/control-quincena.spec.js tests/e2e/auth-roles.spec.js tests/e2e/partidas.spec.js tests/e2e/tareas-manual.spec.js --grep "UAT-008|UAT-009|UAT-010|UAT-025|UAT-028|UAT-1234|UAT-2133|UAT-2206|UAT-234|UAT-2408|UAT-2409"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
