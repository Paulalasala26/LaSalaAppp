name: Verify Especificos ETag and audit Partida TEST

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/verify-especificos-etag-audit-partida-test.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify main concurrency and audit partida architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.error, hashlib, math, collections

          BASE='https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app'
          TMP1='tmp-especificos-etag-v1'
          TMP2='tmp-especificos-etag-v2-A'

          def request(key, method='GET', body=None, headers=None):
              req=urllib.request.Request(f'{BASE}/{key}.json',data=body,method=method,headers=headers or {})
              try:
                  with urllib.request.urlopen(req,timeout=120) as r:
                      return r.status, dict(r.headers), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()

          def put_storage(key,obj,etag=None):
              body=json.dumps(json.dumps(obj,ensure_ascii=False,separators=(',',':')),ensure_ascii=False,separators=(',',':')).encode()
              headers={'Content-Type':'application/json'}
              if etag is not None: headers['if-match']=etag
              return request(key,'PUT',body,headers)

          def get_storage(key,etag=False):
              st,h,raw=request(key,'GET',None,{'X-Firebase-ETag':'true'} if etag else {})
              outer=json.loads(raw.decode())
              obj=json.loads(outer) if isinstance(outer,str) else outer
              return st,h,obj,len(raw)

          def get_raw_json(key):
              st,h,raw=request(key)
              if not (200 <= st < 300):
                  raise SystemExit(f'GET {key} HTTP {st}')
              return json.loads(raw.decode()),len(raw)

          def delete(key):
              request(key,'DELETE')

          # ---- 1) ETag real en TEST: dos clientes, mismas base, calles distintas.
          try:
              initial={'A':{'1':{'1':'BASE','2':'BASE'}}}
              assert 200 <= put_storage(TMP1,initial)[0] < 300
              assert 200 <= put_storage(TMP2,initial['A'])[0] < 300

              st,h1,c1,_=get_storage(TMP1,True); assert st==200
              st,h2,c2,_=get_storage(TMP1,True); assert st==200
              e1=h1.get('ETag') or h1.get('Etag')
              e2=h2.get('ETag') or h2.get('Etag')
              assert e1 and e1==e2

              c1['A']['1']['1']='CLIENTE1'
              assert 200 <= put_storage(TMP1,c1,e1)[0] < 300

              c2['A']['1']['2']='CLIENTE2'
              assert put_storage(TMP1,c2,e2)[0]==412

              st,h3,latest,_=get_storage(TMP1,True); assert st==200
              e3=h3.get('ETag') or h3.get('Etag'); assert e3
              latest['A']['1']['2']='CLIENTE2'
              assert 200 <= put_storage(TMP1,latest,e3)[0] < 300

              _,_,final,_=get_storage(TMP1,False)
              assert final['A']['1']['1']=='CLIENTE1'
              assert final['A']['1']['2']=='CLIENTE2'
              print('ESPECIFICOS_ETAG_RETRY_PRESERVES_BOTH_CHANGES=OK')

              # Mirror v2: simular escritura antigua posterior y reparar desde v1.
              stale={'1':{'1':'CLIENTE1','2':'BASE'}}
              assert 200 <= put_storage(TMP2,final['A'])[0] < 300
              assert 200 <= put_storage(TMP2,stale)[0] < 300
              _,_,v1now,_=get_storage(TMP1,False)
              assert 200 <= put_storage(TMP2,v1now['A'])[0] < 300
              _,_,v2now,_=get_storage(TMP2,False)
              assert v2now==v1now['A']
              print('ESPECIFICOS_V2_CONVERGENCE=OK')
          finally:
              delete(TMP1); delete(TMP2)
              print('TEMP_KEYS_REMOVED=OK')

          # ---- 2) Auditoría real de especificos-partida-v1 en TEST.
          _,_,part,part_raw_bytes=get_storage('lasala-especificos-partida-v1',False)
          assert isinstance(part,dict)
          print('PARTIDA_RAW_BYTES=',part_raw_bytes)
          print('PARTIDA_TOP_KEYS=',len(part))

          total_records=0
          records_with_inv=0
          records_without_inv=0
          key_record_counts=[]
          for k,regs in part.items():
              assert isinstance(regs,list)
              total_records += len(regs)
              key_record_counts.append(len(regs))
              for r in regs:
                  if isinstance(r,dict) and r.get('invId'):
                      records_with_inv += 1
                  else:
                      records_without_inv += 1
          print('PARTIDA_TOTAL_RECORDS=',total_records)
          print('PARTIDA_RECORDS_WITH_INV=',records_with_inv)
          print('PARTIDA_RECORDS_WITHOUT_INV=',records_without_inv)
          print('PARTIDA_MAX_RECORDS_PER_KEY=',max(key_record_counts) if key_record_counts else 0)

          # ---- 3) Cruzar las 827 claves con Control v2 real.
          idx,idx_bytes=get_raw_json('lasala-control-items-v2-index')
          assert isinstance(idx,dict) and isinstance(idx.get('shards'),dict)
          control_ids=set()
          tunel_ids=set()
          carga_ids=set()
          shard_count=0
          for meta in idx['shards'].values():
              if not isinstance(meta,dict) or not meta.get('key'):
                  continue
              shard_count += 1
              obj,_=get_raw_json(meta['key'])
              if not isinstance(obj,dict):
                  continue
              for item_id,item in obj.items():
                  control_ids.add(str(item_id))
                  tipo=(item or {}).get('tipo') if isinstance(item,dict) else meta.get('tipo')
                  if tipo=='tunel': tunel_ids.add(str(item_id))
                  if tipo=='carga': carga_ids.add(str(item_id))

          pkeys=set(map(str,part.keys()))
          print('CONTROL_V2_SHARDS=',shard_count)
          print('CONTROL_IDS=',len(control_ids))
          print('PARTIDA_KEYS_MATCH_CONTROL=',len(pkeys & control_ids))
          print('PARTIDA_KEYS_MATCH_TUNEL=',len(pkeys & tunel_ids))
          print('PARTIDA_KEYS_MATCH_CARGA=',len(pkeys & carga_ids))
          print('PARTIDA_KEYS_NOT_IN_CURRENT_CONTROL=',len(pkeys-control_ids))

          legacy_keys=0
          legacy_keys_match_control=0
          for k,regs in part.items():
              has_legacy=any(not (isinstance(r,dict) and r.get('invId')) for r in regs)
              if has_legacy:
                  legacy_keys += 1
                  if str(k) in control_ids: legacy_keys_match_control += 1
          print('PARTIDA_KEYS_WITH_LEGACY_RECORDS=',legacy_keys)
          print('PARTIDA_LEGACY_KEYS_MATCH_CONTROL=',legacy_keys_match_control)

          # ---- 4) Simular una v2 por buckets de hash de partidaEntryId.
          # FNV-1a 32-bit, trivial de replicar en JS. No se escribe nada.
          def fnv1a(s):
              h=2166136261
              for ch in s.encode('utf-8'):
                  h ^= ch
                  h=(h*16777619)&0xffffffff
              return h

          for n in (16,32,64):
              buckets=[{} for _ in range(n)]
              for k,v in part.items():
                  buckets[fnv1a(str(k))%n][k]=v
              sizes=[]
              counts=[]
              for bucket in buckets:
                  # mismo contrato storage: string JSON dentro de Firebase JSON
                  inner=json.dumps(bucket,ensure_ascii=False,separators=(',',':'))
                  raw=json.dumps(inner,ensure_ascii=False,separators=(',',':')).encode('utf-8')
                  sizes.append(len(raw))
                  counts.append(len(bucket))
              print(f'BUCKETS_{n}_MAX_RAW_BYTES=',max(sizes))
              print(f'BUCKETS_{n}_AVG_RAW_BYTES=',round(sum(sizes)/n,2))
              print(f'BUCKETS_{n}_MAX_KEYS=',max(counts))
              print(f'BUCKETS_{n}_MIN_KEYS=',min(counts))

          print('PARTIDA_AUDIT_OK')
          PY
