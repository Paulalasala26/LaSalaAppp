name: Create Riego v2 index in TEST
on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/migrate-riego-v2-test.yml
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Create verified greenhouse index
        run: |
          set -euo pipefail
          TEST="https://la-sala-app-test-default-rtdb.europe-west1.firebasedatabase.app"
          curl -fsS "$TEST/lasala-riego-v1.json" -o v1.json
          python - <<'PY'
          import json
          obj=json.loads(json.load(open('v1.json',encoding='utf-8')))
          ids=list(obj.keys())
          # storage.set contract: el valor en Firebase es un string JSON.
          inner=json.dumps(ids,ensure_ascii=False,separators=(',',':'))
          open('index.json','w',encoding='utf-8').write(json.dumps(inner,ensure_ascii=False))
          print('INDEX_IDS=',','.join(ids))
          print('INDEX_COUNT=',len(ids))
          PY
          curl -fsS -X PUT -H "Content-Type: application/json" --data-binary @index.json             "$TEST/lasala-riego-v2-index.json" >/dev/null
          curl -fsS "$TEST/lasala-riego-v2-index.json" -o check.json
          python - <<'PY'
          import json
          raw=json.load(open('check.json',encoding='utf-8'))
          ids=json.loads(raw)
          print('INDEX_CHECK_COUNT=',len(ids))
          assert len(ids)==20
          print('RIEGO_V2_INDEX_OK')
          PY
