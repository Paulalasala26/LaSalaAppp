name: UAT Playwright

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: UAT aislado en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Detectar specs modificados en PR
        id: scope
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            const paths = new Set((commit.data.files || []).map(file => file.filename));
            const workflowChanged = paths.has('.github/workflows/uat-playwright.yml');
            core.setOutput('control', String(paths.has('index.html') || paths.has('tests/e2e/control-quincena.spec.js')));
            core.setOutput('auth', String(workflowChanged || paths.has('index.html') || paths.has('tests/e2e/auth-roles.spec.js')));
            core.setOutput('tasks', String(paths.has('tests/e2e/tareas-manual.spec.js')));

      - name: Ejecutar Control QC en PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.control == 'true'
        run: pnpm exec playwright test tests/e2e/control-quincena.spec.js --grep-invert "concurren|offline"

      - name: Ejecutar checks breves de auth en PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.auth == 'true'
        run: pnpm exec playwright test tests/e2e/auth-roles.spec.js --grep "UAT-1983|UAT-1989|UAT-1998|UAT-1999|UAT-2114|UAT-2115|UAT-2122|UAT-2123|UAT-2124|UAT-2129|UAT-2132|UAT-2134|UAT-2135|UAT-2136|UAT-2137|UAT-2138"

      - name: Ejecutar spec de Tareas en PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.tasks == 'true'
        run: pnpm exec playwright test tests/e2e/tareas-manual.spec.js --grep-invert "offline|concurren|simult|a la vez|al mismo tiempo|en paralelo"

      - name: Ejecutar la suite UAT completa fuera de PR
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e

      - name: Exportar estados UAT para revisión
        if: always() && hashFiles('test-results/report.json') != ''
        run: node tests/export-uat-results.cjs

      - name: Guardar informe JSON/HTML y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
