name: UAT Playwright

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: UAT aislado en Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar Control QC y el chequeo breve de marca en PR
        if: github.event_name == 'pull_request'
        run: |
          pnpm exec playwright test tests/e2e/control-quincena.spec.js --grep-invert "concurren|offline"
          pnpm exec playwright test tests/e2e/auth-roles.spec.js --grep "UAT-1983|UAT-1989"

      - name: Ejecutar la suite UAT completa fuera de PR
        if: github.event_name != 'pull_request'
        run: pnpm test:e2e

      - name: Exportar estados UAT para revisión
        if: always() && hashFiles('test-results/report.json') != ''
        run: node tests/export-uat-results.cjs

      - name: Guardar informe JSON/HTML y trazas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
