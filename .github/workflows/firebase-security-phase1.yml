# Isolated security tests only: no deploy, no repository write access, no Firebase credentials.
name: Firebase RTDB Security Phase 1 (isolated)
on:
  push:
    branches:
      - test/v1.0
    paths:
      - '.github/workflows/firebase-security-phase1.yml'
      - 'docs/firebase/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.ref == 'refs/heads/test/v1.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout TEST branch (read only)
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java for Firebase RTDB emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Static permissions matrix
        run: node docs/firebase/check-candidate-phase1.cjs

      - name: Static service credential contract
        run: node docs/firebase/check-phase1-api-service-contract.cjs

      - name: API regression (in-memory, no network)
        run: node --test docs/firebase/regression-phase1-etag.test.cjs

      - name: Isolated alerts and push security prototype
        run: node --test docs/firebase/prototype-avisos-push-v2.test.cjs

      - name: Signed Worker push-gate security prototype (no network)
        run: node --test docs/firebase/prototype-push-worker-gate.test.cjs

      - name: Isolated audit and cron route consolidation regression
        run: node --test docs/firebase/prototype-admin-audit-cron-router.test.cjs

      - name: Unified alerts and push API integration prototype (no network)
        run: node --test docs/firebase/prototype-avisos-push-api-v2.test.cjs

      - name: Audit every frontend alert emitter against security catalog (no network)
        run: node --test docs/firebase/avisos-event-catalog-v2.test.cjs

      - name: Nine-event authorization inventory contract (no network)
        run: node --test docs/firebase/avisos-authorization-contract-v2.test.cjs

      - name: Nine-event authorization decision matrix (pure, no network)
        run: node --test docs/firebase/prototype-event-authorization-v2.test.cjs

      - name: Backend identity and role bridge regression (no network)
        run: node --test docs/firebase/prototype-event-auth-bridge-v2.test.cjs

      - name: Trusted event and greenhouse resolvers with Madrid guard rotation (no network)
        run: node --test docs/firebase/prototype-event-resolvers-v2.test.cjs

      - name: Atomic event and outbox ledger concurrency regression (no network)
        run: node --test docs/firebase/prototype-atomic-event-ledger-v2.test.cjs

      - name: Single-CAS business mutation and event outbox crash/retry tests (no network)
        run: node --test docs/firebase/prototype-business-event-transaction-v2.test.cjs

      - name: Legacy migration assumption and reversibility guard (no network)
        run: node --test docs/firebase/plan-migracion-guard-v2.test.cjs

      - name: Synthetic migration parity and integrity dry-run (pure, no network)
        run: node --test docs/firebase/prototype-migration-dryrun-v3.test.cjs

      - name: Synthetic migration cutover races, offline and proposal reconciliation (no network)
        run: node --test docs/firebase/prototype-migration-reconciliation-v3.test.cjs

      - name: Per-invernadero synthetic writer fence, offline cutover and rollback regressions (no network)
        run: node --test docs/firebase/prototype-writer-fence-v3.test.cjs

      - name: Per-user role INV command authorization and offline error decisions (no network)
        run: node --test docs/firebase/prototype-riego-command-authorization-v3.test.cjs

      - name: Atomic role revocation and proposal TOCTOU commit tests (no network)
        run: node --test docs/firebase/prototype-riego-toctou-commit-v3.test.cjs

      - name: Consolidated twelve-command nine-event integration and QA contract (no network)
        run: node --test docs/firebase/contrato-integracion-riego-v3.test.cjs

      - name: G1/G2 proposed backend authority ADR and privacy contract (no network)
        run: node --test docs/firebase/arquitectura-backend-g1-g2-v3.test.cjs

      - name: Isolated Firebase REST ETag and migration regression
        run: node --test docs/firebase/prototype-avisos-push-store-v2.test.cjs

      - name: Install isolated emulator test dependencies
        working-directory: docs/firebase
        run: |
          cp package.phase1.json package.json
          npm install --ignore-scripts --no-audit --no-fund

      - name: Test candidate rules in demo-only official RTDB emulator
        working-directory: docs/firebase
        env:
          CI: 'true'
        run: npm run test:emulator

      - name: Protect v2 Alerts and Push roots in demo-only RTDB emulator
        working-directory: docs/firebase
        env:
          CI: 'true'
        run: npm run test:emulator:phase2

      - name: Verify legacy riego writer revocation by INV in isolated RTDB emulator
        working-directory: docs/firebase
        env:
          CI: 'true'
        run: npm run test:emulator:riego-freeze

      - name: Signed JWT G2 irrigation gateway and atomic ACL revocation on official RTDB emulator
        working-directory: docs/firebase
        env:
          CI: 'true'
        run: npm run test:emulator:riego-gateway

      - name: Backend JWT and ETag store on official demo RTDB emulator
        working-directory: docs/firebase
        env:
          CI: 'true'
        run: npm run test:emulator:auth-storage
