name: TEMP Patch final concurrency

on:
  push:
    branches:
      - test/v1.0
    paths:
      - .github/workflows/temp-patch-final-concurrency.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/v1.0
          fetch-depth: 0
      - name: Patch final global writers
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          def replace_function(src,name,replacement):
              m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',src)
              if not m: raise SystemExit(name+"_NOT_FOUND")
              start=m.start()
              brace=src.find("{",m.start())
              depth=0
              end=-1
              for i,ch in enumerate(src[brace:],start=brace):
                  if ch=="{": depth+=1
                  elif ch=="}":
                      depth-=1
                      if depth==0:
                          end=i+1
                          break
              if end<0: raise SystemExit(name+"_NO_END")
              return src[:start]+replacement+src[end:]

          repl={
          "saveClimaData": r"""async function saveClimaData(){
            try{
              const local=JSON.parse(JSON.stringify(climaData||{}));
              const tx=await actualizarStorageJsonConEtag(CLIMA_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return mergeDeepPreferLocal(cloud,local);
              });
              if(!tx.ok){ avisarFalloGuardado(); return false; }
              climaData=tx.value;
              return true;
            }catch(e){ avisarFalloGuardado(); return false; }
          }""",
          "guardarClimaConLimpieza": r"""async function guardarClimaConLimpieza(tipo,invId,dia,callesALimpiar){
            try{
              const local=JSON.parse(JSON.stringify(climaData||{}));
              const tx=await actualizarStorageJsonConEtag(CLIMA_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                const combinado=mergeDeepPreferLocal(cloud,local);
                if(combinado[tipo]?.[invId]?.[dia]) callesALimpiar.forEach(c=>delete combinado[tipo][invId][dia][c]);
                return combinado;
              });
              if(!tx.ok){ avisarFalloGuardado(); return false; }
              climaData=tx.value;
              return true;
            }catch(e){ avisarFalloGuardado(); return false; }
          }""",
          "persistClimaCuadroData": r"""async function persistClimaCuadroData(){
            try{
              const locales=climaCuadroData.slice();
              const tx=await actualizarStorageJsonConEtag(CLIMA_CUADRO_KEY,[],cloud=>{
                if(!Array.isArray(cloud)) cloud=[];
                const map={};
                cloud.forEach(t=>map[t.id]=t);
                locales.forEach(t=>map[t.id]=t);
                return Object.values(map);
              });
              if(!tx.ok){ avisarFalloGuardado(); return; }
              climaCuadroData=tx.value;
            }catch(e){ avisarFalloGuardado(); }
          }""",
          "eliminarClimaCuadroEntryConfirmado": r"""async function eliminarClimaCuadroEntryConfirmado(id){
            const tx=await actualizarStorageJsonConEtag(CLIMA_CUADRO_KEY,[],cloud=>{
              if(!Array.isArray(cloud)) cloud=[];
              return cloud.filter(x=>x.id!==id);
            });
            if(!tx.ok){ avisarFalloGuardado(); return; }
            climaCuadroData=tx.value;
            showToast('✓ Eliminado');
            renderClimaContent(document.getElementById('clima-overlay'));
          }""",
          "marcarPresenciaInvernadero": r"""async function marcarPresenciaInvernadero(modulo,invId){
            try{
              const marca={usuario:currentUser||null,ts:Date.now()};
              const tx=await actualizarStorageJsonConEtag(PRESENCIA_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                cloud[modulo]=cloud[modulo]||{};
                cloud[modulo][invId]=marca;
                return cloud;
              });
              if(tx.ok) presenciaData=tx.value;
            }catch(e){}
          }""",
          "persistPropuestasRiegoData": r"""async function persistPropuestasRiegoData(){
            try{
              const locales=propuestasRiegoData.slice();
              const tx=await actualizarStorageJsonConEtag(PROPUESTAS_RIEGO_KEY,[],cloud=>{
                if(!Array.isArray(cloud)) cloud=[];
                const map={};
                cloud.forEach(p=>map[p.id]=p);
                locales.forEach(p=>map[p.id]=p);
                return Object.values(map);
              });
              if(!tx.ok){ avisarFalloGuardado(); return false; }
              propuestasRiegoData=tx.value;
              return true;
            }catch(e){ avisarFalloGuardado(); return false; }
          }""",
          "saveIndiceAbonosEstadoData": r"""async function saveIndiceAbonosEstadoData(){
            try{
              const local={...indiceAbonosEstadoData};
              const tx=await actualizarStorageJsonConEtag(INDICE_ABONOS_ESTADO_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return {...cloud,...local};
              });
              if(!tx.ok){ avisarFalloGuardado(); return; }
              indiceAbonosEstadoData=tx.value;
            }catch(e){ avisarFalloGuardado(); }
          }""",
          "guardarUnDiaSalaOrdenIndice": r"""async function guardarUnDiaSalaOrdenIndice(dia,sala,orden){
            try{
              const tx=await actualizarStorageJsonConEtag(INDICE_ABONOS_ORDEN_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                cloud[dia]=cloud[dia]||{};
                if(orden===null) delete cloud[dia][sala];
                else cloud[dia][sala]=orden;
                return cloud;
              });
              if(!tx.ok){ avisarFalloGuardado(); return false; }
              indiceAbonosOrdenData=tx.value;
              return true;
            }catch(e){ avisarFalloGuardado(); return false; }
          }""",
          "saveInjertoAsignacionData": r"""async function saveInjertoAsignacionData(){
            try{
              const local={...injertoAsignacionData};
              const tx=await actualizarStorageJsonConEtag(INJERTO_ASIGNACION_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return {...cloud,...local};
              });
              if(!tx.ok){ avisarFalloGuardado(); return; }
              injertoAsignacionData=tx.value;
            }catch(e){ avisarFalloGuardado(); }
          }""",
          "saveCargasAsignacionData": r"""async function saveCargasAsignacionData(){
            try{
              const local={...cargasAsignacionData};
              const tx=await actualizarStorageJsonConEtag(CARGAS_ASIGNACION_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return {...cloud,...local};
              });
              if(!tx.ok){ avisarFalloGuardado(); return; }
              cargasAsignacionData=tx.value;
            }catch(e){ avisarFalloGuardado(); }
          }""",
          "guardarSalaEnVivoManualData": r"""async function guardarSalaEnVivoManualData(){
            try{
              const local={...salaEnVivoManualData};
              const tx=await actualizarStorageJsonConEtag(SALA_EN_VIVO_MANUAL_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return {...cloud,...local};
              });
              if(!tx.ok){ avisarFalloGuardado(); return false; }
              salaEnVivoManualData=tx.value;
              return true;
            }catch(e){ avisarFalloGuardado(); return false; }
          }""",
          "persistChecksData": r"""async function persistChecksData(){
            try{
              const local=JSON.parse(JSON.stringify(checksData||{}));
              const tx=await actualizarStorageJsonConEtag(CHECKS_KEY,{},cloud=>{
                if(!cloud||typeof cloud!=='object'||Array.isArray(cloud)) cloud={};
                return mergeDeepPreferLocal(cloud,local);
              });
              if(!tx.ok){ avisarFalloGuardado(); return; }
              checksData=tx.value;
            }catch(e){ avisarFalloGuardado(); }
          }"""
          }

          for name,value in repl.items():
              s=replace_function(s,name,value)

          keys=["CLIMA_KEY","CLIMA_CUADRO_KEY","PRESENCIA_KEY","PROPUESTAS_RIEGO_KEY",
                "INDICE_ABONOS_ESTADO_KEY","INDICE_ABONOS_ORDEN_KEY","INJERTO_ASIGNACION_KEY",
                "CARGAS_ASIGNACION_KEY","SALA_EN_VIVO_MANUAL_KEY","CHECKS_KEY"]
          for key in keys:
              if re.search(r'window\.storage\.set\(\s*'+key+r'\b',s):
                  raise SystemExit("DIRECT_SET_REMAINS_"+key)

          p.write_text(s,encoding="utf-8")

      - name: Validate inline JS and direct global SETs
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const a=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]);
          for(const [i,s] of a.entries()){
            try{ new Function(s); }catch(e){ console.error('script',i+1,e.message); process.exit(1); }
          }
          const direct=[...h.matchAll(/window\.storage\.set\(\s*([A-Z0-9_]+_KEY)\s*,/g)].map(m=>m[1]);
          console.log('INLINE_JS_OK',a.length);
          console.log('DIRECT_GLOBAL_SET_COUNT',direct.length);
          if(direct.length){ console.error('DIRECT_GLOBAL_SET_KEYS',direct.join(',')); process.exit(1); }
          NODE

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix(test): cerrar concurrencia de escrituras globales"
          git push origin HEAD:test/v1.0
