<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ViguerAPP · QC sin conexión</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324e;background:#f0f4f8;color-scheme:light}
*{box-sizing:border-box}body{margin:0;padding:0 12px 24px}
header{background:#2b6fae;color:white;margin:0 -12px 16px;padding:16px max(12px,env(safe-area-inset-left))}
h1{font-size:20px;margin:0}header small{font-size:12px;opacity:.94}
main{max-width:750px;margin:auto}
aside{font-size:13px;color:#33516b;margin:0 0 12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
input,select{min-width:0;width:100%;padding:11px 9px;border:1px solid #aac1d7;background:white;border-radius:8px;color:#17324e;font-size:15px}
#search{grid-column:1/-1}
.item{background:white;padding:12px;border:1px solid #cbd7e3;border-radius:9px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}
.item strong{display:block;color:#1558a0;font-size:16px}
.item span{display:block;color:#516579;font-size:12px;margin-top:4px}
.date{font-size:12px;white-space:nowrap;color:#5d7084}
#status{font-size:14px;padding:11px 12px;background:#e1eafa;border-radius:8px;margin:12px 0}
footer{margin-top:20px;font-size:13px}
a{color:#1558a0;font-weight:700}
</style>
<script src="assets/qc-offline-operarios-store.js" defer></script>
<script src="assets/qc-offline-operarios-screen.js" defer></script>
</head>
<body><header><h1>Control QC · sin conexión</h1><small>Consulta local de partidas · solo lectura</small></header>
<main><div id="status" role="status">Cargando consulta local…</div>
<aside>Datos consultados previamente con conexión. No se pueden modificar controles ni guardar cantidades sin Internet.</aside>
<div id="area" hidden>
<div class="controls">
<select id="tipo" aria-label="Tipo de control"><option value="">Túnel y Carga</option><option value="tunel">Túnel</option><option value="carga">Carga</option></select>
<select id="quincena" aria-label="Quincena"><option value="">Todas las quincenas</option></select>
<input id="search" type="search" placeholder="Buscar número de partida" aria-label="Buscar partida" autocomplete="off">
</div>
<div id="count" role="status"></div><div id="items"></div>
</div>
<footer><a href="./">Volver a ViguerAPP (requiere conexión)</a></footer>
</main></body></html>
